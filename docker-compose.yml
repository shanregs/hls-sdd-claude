services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hls
      POSTGRES_USER: hls
      POSTGRES_PASSWORD: hls
    ports:
      - "5432:5432"
    volumes:
      - hls-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hls -d hls"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hls
      DB_USERNAME: hls
      DB_PASSWORD: hls
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hls-postgres-data:
