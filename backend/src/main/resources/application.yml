spring:
  application:
    name: hls-backend
  servlet:
    multipart:
      # the file store allows 10 MB a file; these limits leave headroom for the form around it
      max-file-size: 11MB
      max-request-size: 12MB
  modulith:
    events:
      # Spec 018: every Android request now publishes an event for the API Access trail. Delete a
      # publication once its listener completes (the audit tables are the durable record), so the
      # registry holds only undelivered events and does not grow with every request.
      completion-mode: delete
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hls}
    username: ${DB_USERNAME:hls}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it — never let
      # Hibernate auto-DDL touch financial/identity tables.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

hls:
  # Business dates (attendance) follow this zone, not the UTC application clock.
  business-timezone: ${HLS_BUSINESS_TIMEZONE:Asia/Kolkata}
  app:
    version: "@project.version@"
  security:
    jwt:
      # Dev-only default; every real deployment MUST override via JWT_SECRET (Constitution
      # Principle X: secrets never in source control). Base64-encoded, >= 32 bytes for HS256.
      secret: ${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}
      access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    cookie:
      secure: ${COOKIE_SECURE:true}
  mobile:
    # Spec 018: oldest Android app version the server accepts; older apps get 426 and must update.
    # These three values move into the settings module with spec 011.
    min-app-version: ${HLS_MOBILE_MIN_APP_VERSION:0.0.0}
    location-wait-seconds: ${HLS_MOBILE_LOCATION_WAIT_SECONDS:4}
    location-reuse-seconds: ${HLS_MOBILE_LOCATION_REUSE_SECONDS:10}
  cache:
    # Small reference tables (permission matrix, status codes, calendar, leave types, OTP policy) are kept in
    # memory; see docs/caching.md. ttl-seconds is the longest a copy is served without a reload, which is how a
    # change made by another application instance or by hand in the database is picked up.
    enabled: ${HLS_CACHE_ENABLED:true}
    ttl-seconds: ${HLS_CACHE_TTL_SECONDS:60}
  notification:
    retention:
      # Spec 010 FR-010: a daily job at 02:30 deletes notifications created more than 90 days ago.
      # The test suite turns it off so the schedule never fires mid-test; purge() is still callable.
      enabled: ${HLS_NOTIFICATION_RETENTION_ENABLED:true}
  session:
    renewal-ttl-days: ${SESSION_RENEWAL_TTL_DAYS:14}
  sms:
    # "dev-stub" (default) logs the code instead of sending real SMS. Set SMS_PROVIDER=msg91 for a
    # real deployment (research.md §15) — MSG91_AUTH_KEY and MSG91_TEMPLATE_ID then become required
    # (no defaults here on purpose: a real deployment must supply real credentials, never a
    # source-controlled placeholder, Constitution Principle X).
    provider: ${SMS_PROVIDER:dev-stub}
    msg91:
      # No defaults here on purpose: with provider=msg91, a missing MSG91_AUTH_KEY or
      # MSG91_TEMPLATE_ID fails startup clearly rather than silently sending with blank credentials.
      auth-key: ${MSG91_AUTH_KEY}
      template-id: ${MSG91_TEMPLATE_ID}
      base-url: ${MSG91_BASE_URL:https://control.msg91.com}
