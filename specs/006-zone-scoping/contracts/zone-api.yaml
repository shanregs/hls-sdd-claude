openapi: 3.0.3
info:
  title: HLS Zone-Based Manager Scoping API (extends Organization)
  description: >
    New endpoints for Zone-Manager coverage (specs/006-zone-scoping,
    reworked), plus one new rejection case on the existing
    `POST /api/v1/organization/school-assignments` endpoint.
    specs/003-organization-scoping/contracts/organization-api.yaml
    documents every endpoint this file doesn't repeat — it is left as the
    historical record of what originally shipped and is not edited by this
    feature. This feature does **not** define Zone or School-Zone
    assignment endpoints — those are `school`'s
    (`specs/007-school-zone/contracts/school-zone-api.yaml`,
    `POST /api/v1/school/zones`, `POST /api/v1/school/school-zone-assignments`).
    Every endpoint here is DIRECTOR/ADMIN-only, same as Organization's
    existing endpoints, via the same real JWT bearer token (spec 002).
  version: "1.0.0"
paths:
  /api/v1/organization/zone-manager-assignments:
    post:
      summary: Assign a Manager to cover a Zone
      description: >
        FR-001/FR-002. Repeatable for different managers — a Zone may have
        more than one current covering Manager. Rejects (404) if `zoneId`
        does not correspond to an existing Zone (validated live through
        `school.api.ZoneQueries`, never a locally-owned copy).
      operationId: assignManagerToZone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId, managerId]
              properties:
                zoneId:
                  type: string
                  format: uuid
                managerId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Manager now covers this Zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneManagerAssignmentView"
        "404":
          description: No Zone with this id exists.
  /api/v1/organization/zone-manager-assignments/{assignmentId}:
    delete:
      summary: Remove a Manager's coverage of a Zone
      description: >
        FR-001. Does not affect any School this Manager currently manages in
        this Zone (spec.md Edge Cases) — that assignment is left as-is.
      operationId: removeManagerFromZone
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Manager no longer covers this Zone.
  /api/v1/organization/zones/{zoneId}/coverage:
    get:
      summary: A Zone's current coverage — Managers and Schools, in one lookup
      description: >
        FR-005, User Story 3. `managerIds` comes from this module's own
        Zone-Manager assignments; `schoolIds` is read live from
        `school.api.ZoneQueries.currentSchoolsForZone(...)` — composed at
        read time, not a persisted or cached join.
      operationId: getZoneCoverage
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current covering Managers and current Schools, even if either list is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCoverage"
  /api/v1/organization/school-assignments:
    post:
      summary: (Existing endpoint, specs/003) Assign or reassign a School's accountable Manager — now Zone-constrained
      description: >
        UNCHANGED request/response shape from organization-api.yaml. The
        only change this feature makes: a new possible rejection
        (FR-003/FR-004), checked before the existing no-op/conflict logic.
      responses:
        "422":
          description: >
            NEW (FR-003/FR-004): the chosen Manager does not currently
            cover this School's Zone — or the School has no current Zone,
            or its Zone has no covering Managers yet. Never retry-worthy
            as-is; a different Manager (or fixing the Zone-coverage setup
            first) is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneMembershipError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity & Access's real JWT bearer token (spec 002). Director/Admin role required, same pattern as every existing Organization endpoint.
  schemas:
    ZoneManagerAssignmentView:
      type: object
      required: [id, zoneId, managerId, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date-time
    ZoneCoverage:
      type: object
      required: [zoneId, managerIds, schoolIds]
      properties:
        zoneId:
          type: string
          format: uuid
        managerIds:
          type: array
          items:
            type: string
            format: uuid
        schoolIds:
          type: array
          items:
            type: string
            format: uuid
    ZoneMembershipError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Manager does not currently cover this School's Zone."
