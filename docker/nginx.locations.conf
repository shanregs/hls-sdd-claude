# Locations and per-request limits shared by nginx.local.conf and nginx.prod.conf, so what the rate-limit tests
# exercise locally is what runs in production. Included inside a server block (installed as /etc/nginx/hls-locations.conf).

# Uploads are capped at 10 MB by the file store (spring.servlet.multipart allows 12 MB with the form around it).
client_max_body_size   12m;
client_header_timeout  10s;
client_body_timeout    10s;
keepalive_timeout      15s;
limit_conn             hls_conn 100;

# Login, OTP and password reset: tight rate, tiny bodies.
location /api/v1/auth/ {
  limit_req             zone=hls_auth burst=20 nodelay;
  client_max_body_size  16k;
  proxy_read_timeout    30s;
  proxy_pass            http://backend:8080;
}

# Content uploads (spec 029): video up to 500 MB, so a larger body, longer timeouts and no request buffering.
# Everything else under /api/ keeps the 12 MB limit above. See docs/aws-deployment-and-ddos-protection.md section 8.
location /api/v1/content/ {
  limit_req               zone=hls_api burst=100 nodelay;
  client_max_body_size    520m;
  client_body_timeout     300s;
  proxy_read_timeout      300s;
  proxy_send_timeout      300s;
  proxy_request_buffering off;
  proxy_pass              http://backend:8080;
}

location /api/ {
  limit_req           zone=hls_api burst=100 nodelay;
  proxy_read_timeout  60s;
  proxy_pass          http://backend:8080;
}

# Vite emits hashed file names under /assets, so they can be cached for good.
location /assets/ {
  expires     1y;
  add_header  Cache-Control "public, immutable";
  try_files   $uri =404;
}

location / {
  try_files $uri /index.html;
}
