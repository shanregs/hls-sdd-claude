# Local Docker server block. Rate limits live in nginx.limits.conf and the locations in nginx.locations.conf.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  include /etc/nginx/hls-locations.conf;
}
