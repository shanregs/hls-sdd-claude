# Production server block. It sits behind Cloudflare (through a Cloudflare Tunnel, so nothing is exposed on the host).
# Rate limits live in nginx.limits.conf and the locations in nginx.locations.conf.

# Take the real client address from Cloudflare so the rate limits and logs see the user, not the proxy.
# Only trust the header from Cloudflare and from the Docker network the tunnel connects over; keep the Cloudflare
# list in step with https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # $remote_addr is the real client after real_ip; never forward a client-supplied X-Forwarded-For.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/hls-locations.conf;
}
