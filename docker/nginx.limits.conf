# http-level rate-limit zones, shared by the local and production nginx (installed as conf.d/00-limits.conf).
# Limits are per client IP. A school may share one public IP across many staff, so keep these generous and tighten
# them in Cloudflare (which sees the same traffic) rather than here.

# Login, OTP and password reset: 30 requests a minute, bursts of 20 (see nginx.locations.conf).
limit_req_zone $binary_remote_addr zone=hls_auth:10m rate=30r/m;
# Everything else under /api/: 30 requests a second, bursts of 100.
limit_req_zone $binary_remote_addr zone=hls_api:10m rate=30r/s;
# Open connections per client IP, across the whole server.
limit_conn_zone $binary_remote_addr zone=hls_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
