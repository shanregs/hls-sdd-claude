# Whole stack in Docker for local UI checks: PostgreSQL + backend (demo data) + frontend.
# Start with scripts\run-all.ps1.
name: hls-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hls
      POSTGRES_USER: hls
      POSTGRES_PASSWORD: hls
    ports:
      - "5433:5432"
    volumes:
      - hls-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hls -d hls"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hls
      DB_USERNAME: hls
      DB_PASSWORD: hls
      COOKIE_SECURE: "false"
      HLS_SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    volumes:
      - hls-files:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  hls-postgres-data:
  hls-files:
