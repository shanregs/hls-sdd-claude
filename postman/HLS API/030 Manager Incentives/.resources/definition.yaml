description: "Manager incentives (spec 030). One incentive per closed School, earned when its MoU is approved; the Director or the Zone Manager of the School approves, rejects or (Director only) reopens; an approved incentive reaches Manager payroll once. Admin and Director see all, a Manager sees their own. Teacher and System get 403. Collection variables: incentiveId, incentiveVersion (read from Detail), the Director or Zone Manager login for the decision requests. The amount is a setting, changed under Settings (System group)."
