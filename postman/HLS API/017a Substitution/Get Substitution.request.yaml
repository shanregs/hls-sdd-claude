$kind: http-request
name: Get Substitution
description: "Detail with history and School informed. 404 when out of scope."
url: "{{baseUrl}}/api/v1/substitutions/{{substitutionId}}"
method: GET
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('substitutionId', j.id); pm.collectionVariables.set('substitutionVersion', j.version); }"
    language: text/javascript
order: 2000
