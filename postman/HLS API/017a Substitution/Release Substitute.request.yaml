$kind: http-request
name: Release Substitute
description: "Needs Edit. Back to OPEN."
url: "{{baseUrl}}/api/v1/substitutions/{{substitutionId}}/release"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Substitute unavailable",
      "version": {{substitutionVersion}}
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('substitutionId', j.id); pm.collectionVariables.set('substitutionVersion', j.version); }"
    language: text/javascript
order: 5000
