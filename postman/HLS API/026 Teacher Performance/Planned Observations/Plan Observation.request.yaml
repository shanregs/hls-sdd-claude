$kind: http-request
name: Plan Observation
description: "201 for a new plan, 200 when the Teacher already has an open plan (it is changed, no second task or notification). Reasons SCHOOL_FEEDBACK, MANAGEMENT_PLAN, FOLLOW_UP, OTHER (with reasonText). Needs CREATE."
url: "{{baseUrl}}/api/v1/teacher-performance/plans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "teacherId": "{{teacherId}}",
      "plannedOn": "2026-09-30",
      "reason": "MANAGEMENT_PLAN"
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('planId', j.id); pm.collectionVariables.set('planVersion', j.version); }"
    language: text/javascript
order: 2000
