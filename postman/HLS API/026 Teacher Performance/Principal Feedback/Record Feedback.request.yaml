$kind: http-request
name: Record Feedback
description: "201. Comments 10 to 2000 characters. Completes the Manager's open Principal feedback task for the Teacher. Needs CREATE."
url: "{{baseUrl}}/api/v1/teacher-performance/feedback"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "teacherId": "{{teacherId}}",
      "principalName": "Mrs Rao",
      "givenOn": "2026-09-10",
      "category": "TEACHING",
      "comments": "The lessons are hard to follow for the little ones",
      "actionRequired": true
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('feedbackId', j.id); pm.collectionVariables.set('feedbackVersion', j.version); }"
    language: text/javascript
order: 2000
