$kind: http-request
name: Open Issue From Feedback
description: "Opens a performance issue from this feedback, or adds it to the Teacher's open one. Needs CREATE."
url: "{{baseUrl}}/api/v1/teacher-performance/feedback/{{feedbackId}}/issue"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('issueId', j.id); pm.collectionVariables.set('issueVersion', j.version); }"
    language: text/javascript
order: 6000
