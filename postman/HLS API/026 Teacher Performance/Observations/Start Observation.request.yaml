$kind: http-request
name: Start Observation
description: "201. Starts a draft for an ACTIVE Teacher placed at a School; the form comes back with the School, observer and date filled in. Needs CREATE."
url: "{{baseUrl}}/api/v1/teacher-performance/observations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "teacherId": "{{teacherId}}"
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('observationId', j.id); pm.collectionVariables.set('observationVersion', j.version); }"
    language: text/javascript
order: 2000
