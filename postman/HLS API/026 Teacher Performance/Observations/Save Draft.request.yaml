$kind: http-request
name: Save Draft
description: "Saves the draft (observer only). Permission is optional: leave \"permission\" out and the observation shows \"Permission not recorded\". Needs EDIT."
url: "{{baseUrl}}/api/v1/teacher-performance/observations/{{observationId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": "{{observationVersion}}",
      "className": "Class 5",
      "subject": "English",
      "durationMinutes": 40,
      "ratings": {
        "ENGLISH_COMMUNICATION": 4,
        "TEACHING_ABILITY": 4,
        "CONTENT_DELIVERY": 4,
        "CLASSROOM_MANAGEMENT": 3,
        "STUDENT_ENGAGEMENT": 4,
        "PREPARATION": 4,
        "CONFIDENCE": 4,
        "PUNCTUALITY": 5
      },
      "overallResult": "GOOD",
      "strengths": "Clear voice and good rapport with the pupils",
      "improvements": null,
      "permission": {
        "by": "Mrs Rao",
        "way": "PHONE",
        "on": "2026-09-10"
      }
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('observationId', j.id); pm.collectionVariables.set('observationVersion', j.version); }"
    language: text/javascript
order: 5000
