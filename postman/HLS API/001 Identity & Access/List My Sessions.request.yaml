$kind: http-request
url: "{{baseUrl}}/api/v1/me/sessions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const b = pm.response.json();
      const list = Array.isArray(b) ? b : (b.sessions || []);
      if (list.length) { pm.collectionVariables.set("sessionId", list[0].id || list[0].sessionId); }
    language: text/javascript
order: 10000
