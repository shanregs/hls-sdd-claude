$kind: http-request
description: identifier is phone or username. Sets renewal cookie (kept in Postman cookie jar).
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{loginIdentifier}}",
      "password": "{{loginPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const b = pm.response.json();
      if (b.accessToken) { pm.collectionVariables.set("accessToken", b.accessToken); }
      if (b.user && b.user.id) { pm.collectionVariables.set("userId", b.user.id); }
    language: text/javascript
order: 1000
