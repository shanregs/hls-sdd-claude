$kind: http-request
url: "{{baseUrl}}/api/v1/auth/otp/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "destination": "{{loginIdentifier}}",
      "code": "123456",
      "purpose": "PASSWORD_RESET",
      "channel": "SMS"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const b = pm.response.json();
      const t = b.resetToken || b.token;
      if (t) { pm.collectionVariables.set("resetToken", t); }
    language: text/javascript
order: 8000
