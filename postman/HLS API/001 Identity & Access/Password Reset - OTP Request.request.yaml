$kind: http-request
description: "channel: SMS | EMAIL | BOTH. destination is a phone-or-username identifier."
url: "{{baseUrl}}/api/v1/auth/otp/request"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "destination": "{{loginIdentifier}}",
      "channel": "SMS",
      "purpose": "PASSWORD_RESET"
    }
auth:
  type: noauth
order: 7000
