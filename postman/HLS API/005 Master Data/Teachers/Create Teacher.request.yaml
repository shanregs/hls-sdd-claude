$kind: http-request
url: "{{baseUrl}}/api/v1/teachers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Tara Teacher",
      "phone": "9800000004",
      "email": "tara@example.com",
      "address": "1 Main Road",
      "status": "IN_TRAINING",
      "userId": null
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const t = pm.response.json(); pm.collectionVariables.set("teacherId", t.id); pm.collectionVariables.set("teacherVersion", t.version); }
    language: text/javascript
order: 2000
