$kind: http-request
description: A School needs a Place; its Zone is the Place Zone.
url: "{{baseUrl}}/api/v1/schools"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "St Marys",
      "placeId": "{{placeId}}",
      "address": "1 Main Road",
      "contactPerson": "Head Teacher",
      "contactPhone": "9000000000",
      "billingContact": "accounts@school.example"
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const sc = pm.response.json(); pm.collectionVariables.set("schoolId", sc.id); pm.collectionVariables.set("schoolVersion", sc.version); }
    language: text/javascript
order: 2000
