$kind: http-request
description: 409 naming the Schools if a removed Zone still has the Manager Schools.
url: "{{baseUrl}}/api/v1/managers/{{managerId}}/zones"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "zoneIds": [
        "{{zoneId}}"
      ],
      "version": "{{managerVersion}}"
    }
order: 5000
