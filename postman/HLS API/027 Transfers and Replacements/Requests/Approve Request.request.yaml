$kind: http-request
name: Approve Request
description: "Needs APPROVE. 403 for the requester and for Admin."
url: "{{baseUrl}}/api/v1/transfers/{{requestId}}/approve"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{requestVersion}}
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('requestId', j.id); pm.collectionVariables.set('requestVersion', j.version); }"
    language: text/javascript
order: 9000
