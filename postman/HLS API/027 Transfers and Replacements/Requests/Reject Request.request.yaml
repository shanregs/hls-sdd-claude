$kind: http-request
name: Reject Request
description: "Needs APPROVE and a reason."
url: "{{baseUrl}}/api/v1/transfers/{{requestId}}/reject"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{requestVersion}},
      "reason": "Not needed"
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code < 300) { const j = pm.response.json(); pm.collectionVariables.set('requestId', j.id); pm.collectionVariables.set('requestVersion', j.version); }"
    language: text/javascript
order: 10000
