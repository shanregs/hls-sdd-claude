description: "Salary structures by designation and the pay policy (spec 013a). Admin and Director only (SALARY_STRUCTURES VIEW and CREATE); Zone Manager, Teacher and System get 403 on every endpoint. Rows are append-only: a correction is a new row, and there is no edit or delete. Only the People requests return an individual's pay. Each person's own salary is under People (amended 2026-10-11: HLS has no fixed pay scale; a designation's amount is only a suggested default). Collection variables: designationId (from 005a Designations - Add Designation), managerId (from the 005 folder) and userId (a staff member's user id)."
order: 13100
