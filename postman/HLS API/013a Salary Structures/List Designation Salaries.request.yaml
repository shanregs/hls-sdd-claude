$kind: http-request
name: List Designation Salaries
description: "Every designation with its suggested default in effect today (inEffect is null when none: 'no default yet'; nobody is paid it), its kind, retired flag and the missing-salary flag with the number of people left without a salary. Every designation carries defaultNote; missingSalary counts the holders who have no salary of their own. Optional filters kind (TEACHER or MANAGER) and includeRetired=true. Needs SALARY_STRUCTURES.VIEW."
url: "{{baseUrl}}/api/v1/salary-structures/designations?includeRetired=false"
method: GET
order: 1000
