url: "{{baseUrl}}/api/v1/expenses/{{claimId}}/record-paid"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": 2,
      "paidOn": "2026-10-22",
      "mode": "BANK_TRANSFER",
      "reference": "UTR123456"
    }
order: 7000
