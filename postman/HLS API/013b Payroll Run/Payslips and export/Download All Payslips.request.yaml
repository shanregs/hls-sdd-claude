$kind: http-request
name: Download All Payslips
description: "A zip with every payslip of an approved run. Needs PAYROLL.VIEW."
url: "{{baseUrl}}/api/v1/payroll/runs/{{runId}}/payslips"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const st = pm.collectionVariables.get('runStatus');
      if (st === 'APPROVED') {
        pm.test('200 application/zip on an approved run', () => { pm.response.to.have.status(200); pm.expect(pm.response.headers.get('Content-Type')).to.include('zip'); });
        pm.test('body is a zip (starts PK)', () => pm.expect(pm.response.text().slice(0, 2)).to.eql('PK'));
      } else {
        pm.test('404 for a ' + st + ' run (no payslips before approval)', () => pm.response.to.have.status(404));
      }
    language: text/javascript
order: 2000
