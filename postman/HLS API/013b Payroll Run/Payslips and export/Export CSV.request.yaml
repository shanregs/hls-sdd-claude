$kind: http-request
name: Export CSV
description: "The run as CSV (UTF-8 with a byte-order mark): the first two rows state the month and the run status, then one row per person. Allowed for a draft too, and marked as one. Each export is audited as PAYROLL_EXPORT. Needs PAYROLL.EXPORT."
url: "{{baseUrl}}/api/v1/payroll/runs/{{runId}}/export"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 text/csv', () => { pm.response.to.have.status(200); pm.expect(pm.response.headers.get('Content-Type')).to.include('csv'); });
      const lines = pm.response.text().replace(/^\uFEFF/, '').split(/\r?\n/).filter(x => x.length);
      pm.test('first row states the month, second the run status', () => { pm.expect(lines.length).to.be.above(2); pm.expect(lines[0]).to.include(pm.variables.get('month')); pm.expect(lines[1].toUpperCase()).to.include(pm.collectionVariables.get('runStatus').split('_')[0]); });
      pm.test('a header row and at least one person row follow', () => pm.expect(lines.length).to.be.above(3));
    language: text/javascript
order: 3000
