$kind: http-request
name: Download Payslip
description: "The PDF issued at approval. 404 for a draft or awaiting run and for a cannot-pay line. Needs PAYROLL.VIEW."
url: "{{baseUrl}}/api/v1/payroll/runs/{{runId}}/lines/{{lineId}}/payslip"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const st = pm.collectionVariables.get('runStatus');
      if (st === 'APPROVED') {
        pm.test('200 application/pdf on an approved run', () => { pm.response.to.have.status(200); pm.expect(pm.response.headers.get('Content-Type')).to.include('application/pdf'); });
        pm.test('body is a PDF (starts %PDF)', () => pm.expect(pm.response.text().slice(0, 4)).to.eql('%PDF'));
      } else {
        pm.test('404 for a ' + st + ' run (no payslip exists before approval, spec FR-023)', () => pm.response.to.have.status(404));
      }
    language: text/javascript
order: 1000
