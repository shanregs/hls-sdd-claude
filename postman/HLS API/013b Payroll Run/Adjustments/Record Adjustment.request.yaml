$kind: http-request
name: Record Adjustment
description: "201. Only the CORRECTION kind can be recorded here; a reserved kind answers 400. Joins the next run that is computed for the person. Needs PAYROLL.PROCESS."
url: "{{baseUrl}}/api/v1/payroll/adjustments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "personKind": "{{personKind}}",
      "personId": "{{personId}}",
      "kind": "CORRECTION",
      "amount": 2000,
      "reason": "August was underpaid"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 created', () => pm.response.to.have.status(201));
      const a = pm.response.json();
      pm.test('a WAITING CORRECTION of 2000 for the chosen person', () => {
        pm.expect(a.id).to.be.a('string');
        pm.expect(a.status).to.eql('WAITING');
        pm.expect(a.kind).to.eql('CORRECTION');
        pm.expect(Number(a.amount)).to.eql(2000);
        pm.expect(a.personId).to.eql(pm.collectionVariables.get('personId'));
        pm.expect(a.personKind).to.eql(pm.collectionVariables.get('personKind'));
      });
      if (a.id) { pm.collectionVariables.set('adjustmentId', a.id); }
    language: text/javascript
order: 2000
