$kind: http-request
name: Get Run
description: "Header, status, totals, counts, progress, paid and unpaid figures, the pay policy, the history of events and the summary of the last compute. Needs PAYROLL.VIEW."
url: "{{baseUrl}}/api/v1/payroll/runs/{{runId}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // After Start Run or Compute Again the lines are computed in the background: wait (up to 60 seconds) until the run reports DONE, then read it.
      if (pm.collectionVariables.get('awaitCompute') === 'yes') {
        const url = pm.variables.replaceIn('{{baseUrl}}/api/v1/payroll/runs/{{runId}}');
        const token = pm.collectionVariables.get('accessToken');
        const poll = (left) => pm.sendRequest({ url: url, method: 'GET', header: { Authorization: 'Bearer ' + token } }, (err, res) => {
          const s = !err && res.code === 200 ? res.json().computeState : null;
          if (s === 'DONE' || s === 'FAILED' || left <= 0) { return; }
          setTimeout(() => poll(left - 1), 1000);
        });
        poll(60);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('is the run in runId, for the month', () => { pm.expect(r.id).to.eql(pm.collectionVariables.get('runId')); pm.expect(r.month).to.eql(pm.variables.get('month')); });
      pm.test('has status, computeState, totals, counts and policy', () => {
        pm.expect(r.status).to.be.oneOf(['DRAFT', 'AWAITING_APPROVAL', 'APPROVED', 'CANCELLED']);
        pm.expect(r.computeState).to.be.oneOf(['QUEUED', 'RUNNING', 'DONE', 'FAILED']);
        if (r.computeState === 'DONE') {
          ['earned', 'deduction', 'adjustments', 'net'].forEach(k => pm.expect(r.totals).to.have.property(k));
          pm.expect(r.payableCount).to.be.a('number');
          pm.expect(r.cannotPayCount).to.be.a('number');
          pm.expect(r.policy).to.have.property('rounding');
        }
      });
      pm.test('net = earned - deduction + adjustments', () => {
        const t = r.totals || { net: 0, earned: 0, deduction: 0, adjustments: 0 };
        pm.expect(Number(t.net)).to.be.closeTo(Number(t.earned) - Number(t.deduction) + Number(t.adjustments), 0.51);
      });
      pm.collectionVariables.set('runStatus', r.status);
      pm.collectionVariables.set('computeState', r.computeState);
      pm.collectionVariables.set('runVersion', r.version);
      console.log('STATE computeState=' + r.computeState + ' runStatus=' + r.status + ' adjustments=' + (r.totals || {}).adjustments + ' net=' + (r.totals || {}).net);
      pm.collectionVariables.set('awaitCompute', '');
    language: text/javascript
order: 3000
