$kind: http-request
name: Start Run
description: "202 with the run (computeState QUEUED); the lines are computed in the background, so read the run until computeState is DONE. 400 when the month has not ended; 409 when a primary run exists. Set supplementary to true to start the run for people left out of an approved primary run. Needs PAYROLL.PROCESS."
url: "{{baseUrl}}/api/v1/payroll/runs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "month": "{{month}}",
      "supplementary": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('202 accepted (a spare month with no live primary run)', () => pm.response.to.have.status(202));
      const r = pm.response.json();
      pm.test('run is a queued DRAFT PRIMARY run for the month', () => {
        pm.expect(r.id).to.be.a('string');
        pm.expect(r.month).to.eql(pm.variables.get('month'));
        pm.expect(r.status).to.eql('DRAFT');
        pm.expect(r.kind).to.eql('PRIMARY');
        pm.expect(r.computeState).to.be.oneOf(['QUEUED', 'RUNNING', 'DONE']);
      });
      if (r.id) { pm.collectionVariables.set('runId', r.id); pm.collectionVariables.set('runStatus', r.status); pm.collectionVariables.set('awaitCompute', 'yes'); }
      console.log('STATE runId=' + r.id);
    language: text/javascript
order: 2000
