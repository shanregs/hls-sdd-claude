$kind: http-request
name: Get Person History
description: "Each run the person was in: month, run kind, net pay, status and the current payment entry. kind is TEACHER, MANAGER or STAFF. Needs PAYROLL.VIEW."
url: "{{baseUrl}}/api/v1/payroll/people/{{personKind}}/{{personId}}/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const h = pm.response.json();
      const rows = Array.isArray(h) ? h : (h.runs || h.content || h.history || []);
      pm.test('an array of runs the person was in', () => pm.expect(rows).to.be.an('array'));
      pm.test('this run is listed with month and status', () => {
        const row = rows.find(r => (r.runId || r.id) === pm.collectionVariables.get('runId'));
        pm.expect(row, 'run in history').to.be.an('object');
        pm.expect(row.month).to.eql(pm.variables.get('month'));
        pm.expect(row.status || row.runStatus).to.eql(pm.collectionVariables.get('runStatus'));
      });
    language: text/javascript
order: 3000
