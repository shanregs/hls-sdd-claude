$kind: http-request
name: Add Adjustment
description: "Credit note against a due: a positive amount (two decimals at most) that reduces what is owed; it cannot exceed the current balance (400). A reason of 3 or more characters is required. 201 with the adjustment. Needs SCHOOL_BILLING.EDIT."
url: "{{baseUrl}}/api/v1/school-billing/dues/{{dueId}}/adjustments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 500.00,
      "reason": "Teacher absent without cover, agreed with the School"
    }
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200 || pm.response.code === 201) { const r = pm.response.json(); if (r.id) { pm.collectionVariables.set('billingAdjustmentId', r.id); } }"
    language: text/javascript
order: 8000
