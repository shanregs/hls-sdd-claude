description: "School billing (spec 022): the monthly dues Schools owe HLS for the Teachers placed with them, the ledger, adjustments (credit notes), collections and allocation, ageing, the not-billed list, CSV export and settings. Needs SCHOOL_BILLING: View, Create (record and allocate collections), Edit (raise dues, adjustments, reverse, settings), Approve (cancel a due) and Export. Admin and Director are org-wide; the Zone Manager sees only the Schools of their Zone (outside it is a 404); Teacher and System get 403. Money is in rupees with two decimals. Collection variables: month (YYYY-MM), schoolId, dueId (saved by List Dues), billingAdjustmentId (saved by Add Adjustment) and billingCollectionId (saved by Record Collection). Contracts and mapping are in the 012 and 031 folders."
order: 22000
