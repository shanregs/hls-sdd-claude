$kind: http-request
name: List Dues
description: "Page of monthly dues. Filters schoolId, month and status; page and size (default 0 and 25). Saves the first due as dueId. Needs SCHOOL_BILLING.VIEW."
url: "{{baseUrl}}/api/v1/school-billing/dues?schoolId={{schoolId}}&month={{month}}&page=0&size=25"
method: GET
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200) { const r = pm.response.json(); const rows = r.content || r.items || []; if (rows.length && rows[0].id) { pm.collectionVariables.set('dueId', rows[0].id); } }"
    language: text/javascript
order: 5000
