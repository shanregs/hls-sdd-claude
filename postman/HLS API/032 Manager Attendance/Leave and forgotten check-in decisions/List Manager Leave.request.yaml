$kind: http-request
name: List Manager Leave
description: "Managers' leave requests. Optional status (PENDING, APPROVED, REJECTED, CANCELLED, REVOKED) and managerId. Saves the first as managerLeaveId. Needs MANAGER_LEAVE.VIEW."
url: "{{baseUrl}}/api/v1/manager-attendance/leave?status=PENDING"
method: GET
scripts:
  - type: afterResponse
    code: const b = pm.response.json(); if (Array.isArray(b) && b.length) { pm.collectionVariables.set("managerLeaveId", b[0].id); }
    language: text/javascript
order: 1000
