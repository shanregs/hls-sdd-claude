$kind: http-request
name: Reject Leave
description: "Reject with a required reason. 400 without one; 403 for the requester; 409 when it is not pending. Needs MANAGER_LEAVE.APPROVE."
url: "{{baseUrl}}/api/v1/manager-attendance/leave/{{managerLeaveId}}/reject"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Month end"
    }
order: 3000
