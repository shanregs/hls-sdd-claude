$kind: http-request
name: List Leave Types
description: "The active leave types of spec 009, with which one is Loss of Pay. Needs MY_MANAGER_ATTENDANCE.VIEW."
url: "{{baseUrl}}/api/v1/manager-attendance/me/leave/types"
method: GET
scripts:
