$kind: http-request
description: "Own notifications, newest first, with the caller's unread count. Page size is capped at 100. Saves the first one as notificationId."
url: "{{baseUrl}}/api/v1/me/notifications?page=0&size=25"
method: GET
scripts:
  - type: afterResponse
    code: const b = pm.response.json(); if (b.content && b.content.length) { pm.collectionVariables.set("notificationId", b.content[0].id); }
    language: text/javascript
order: 1000
